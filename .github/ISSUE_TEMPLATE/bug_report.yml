name: Bug report
description: Something on Aven broke or behaves wrong
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "And what you expected instead" }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps, placeholder: "1. Open /trade/?m=ETH\n2. Type / long eth 10x 500\n3. …" }
  - type: input
    id: device
    attributes: { label: Browser and device, placeholder: "Chrome 141, Android 15" }
